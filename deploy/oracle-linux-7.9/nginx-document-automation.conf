# OPTIONAL nginx reverse proxy for Document Automation (Oracle Linux 7.9).
#
#   sudo yum install -y nginx                      # from ol7_developer_EPEL
#   sudo cp deploy/oracle-linux-7.9/nginx-document-automation.conf /etc/nginx/conf.d/
#   sudo setsebool -P httpd_can_network_connect 1   # SELinux: allow nginx -> 127.0.0.1:8000
#   sudo nginx -t && sudo systemctl enable --now nginx
#
# Keep APP_HOST=127.0.0.1 in .env when nginx is used.

server {
    listen 80;
    server_name _;

    # 0 = no upload size limit (the application has no limit either).
    client_max_body_size 0;
    # Stream large uploads to the application instead of buffering them in nginx.
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large PDFs at high DPI are converted during the upload request.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
